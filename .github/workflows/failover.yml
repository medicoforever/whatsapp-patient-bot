name: 24/7 Render Failover & cron-job.org Watchdog

on:
  schedule:
    # Runs automatically every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger

jobs:
  check-and-failover:
    name: Check Render Status & Auto-Switch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Failover Check
        run: node render-failover-manager.js
        env:
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          CRON_JOB_ID: '7156467'
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
